<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Для Ксюши ❤️</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{
    min-height:100vh;
    overflow-x:hidden;
    background:linear-gradient(-45deg,#ff758c,#ff7eb3,#ff9a9e,#fad0c4);
    background-size:400% 400%;
    animation:bg 12s ease infinite;
    color:white;
}

@keyframes bg{
    0%{background-position:0% 50%;}
    50%{background-position:100% 50%;}
    100%{background-position:0% 50%;}
}

/* layout */
.container{
    width:92%;
    max-width:1100px;
    margin:20px auto;
    text-align:center;
    position:relative;
    z-index:10;
}

h1{
    font-size:clamp(1.8rem,5vw,3rem);
    margin-bottom:15px;
}

/* tabs */
.tabs{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:8px;
    margin-bottom:20px;
}

.tab-btn{
    padding:10px 14px;
    border:none;
    border-radius:40px;
    background:white;
    color:#ff4f81;
    font-weight:bold;
    font-size:13px;
}

/* tab content */
.tab-content{
    display:none;
    background:rgba(255,255,255,0.15);
    backdrop-filter:blur(10px);
    border-radius:18px;
    padding:18px;
}

.active{display:block;}

/* timer */
.timer{
    font-size:clamp(1rem,4vw,1.3rem);
    line-height:1.7;
}

/* gallery */
.gallery{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(130px,1fr));
    gap:10px;
}

.gallery-caption{
    grid-column:1 / -1;
    font-size:0.95rem;
    opacity:0.95;
    text-align:center;
    font-style:italic;
    margin-bottom:2px;
}

.proposal-block{
    margin-bottom:14px;
}

.proposal-block img{
    width:100%;
    max-width:320px;
    height:auto;
    display:block;
    margin:0 auto;
    cursor:pointer;
    box-shadow:0 8px 24px rgba(0,0,0,0.16);
}

.gallery img{
    width:100%;
    height:140px;
    object-fit:cover;
    border-radius:12px;
    cursor:pointer;
}

/* buttons */
button{
    padding:12px 20px;
    border:none;
    border-radius:40px;
    cursor:pointer;
}

#openLove{
    background:white;
    color:#ff4f81;
    margin-top:10px;
}

#loveBtn{
    display:none;
    margin-top:10px;
    background:#ff1744;
    color:white;
}

/* message */
.message{
    opacity:0;
    transform:translateY(10px);
    transition:1s;
    margin-top:10px;
    font-size:1.1rem;
}

.wedding-card{
    background:rgba(255,255,255,0.22);
    border:1px solid rgba(255,255,255,0.35);
    border-radius:20px;
    padding:18px 16px;
    margin-top:8px;
    box-shadow:0 10px 30px rgba(0,0,0,0.12);
}

.wedding-date{
    font-size:1.1rem;
    font-weight:700;
    padding:10px 0;
    border-bottom:1px solid rgba(255,255,255,0.25);
}

.wedding-date:last-child{
    border-bottom:none;
    padding-bottom:0;
}

.wedding-date span{
    display:block;
    font-size:0.95rem;
    font-weight:500;
    margin-top:4px;
    opacity:0.95;
}

.show{
    opacity:1;
    transform:translateY(0);
}

/* hearts & roses */
.heart,.rose{
    position:absolute;
    pointer-events:none;
}

/* map */
.map{
    width:100%;
    height:320px;
    border-radius:15px;
    margin-top:10px;
}

.leaflet-container{
    border-radius:15px;
}

.heart-icon{
    font-size:1.6rem;
    line-height:1;
}

/* modal */
.modal{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.85);
    display:none;
    justify-content:center;
    align-items:center;
    z-index:999;
}

.modal img{
    max-width:95%;
    max-height:85%;
    border-radius:15px;
}

/* fireworks */
#fireworks{
    position:fixed;
    inset:0;
    pointer-events:none;
}

</style>
</head>

<body>

<audio id="music" loop>
    <source src="music.mp3">
</audio>

<canvas id="fireworks"></canvas>

<div class="container">

<h1>Для Ксюши ❤️</h1>

<div class="tabs">
<button class="tab-btn" onclick="showTab('t1')">❤️ Вместе</button>
<button class="tab-btn" onclick="showTab('t2')">📸 Фото</button>
<button class="tab-btn" onclick="showTab('t3')">💍 Свадьба</button>
<button class="tab-btn" onclick="showTab('t4')">📍 Встреча</button>
</div>

<!-- TAB 1 -->
<div id="t1" class="tab-content active">

<div class="timer">
Мы вместе уже:<br><br>
<div id="time"></div>
</div>

<button id="openLove" onclick="openLove(event)">Открыть ❤️</button>

<div class="message" id="msg">
Ксюша...<br><br>
Ты — самое важное в моей жизни ❤️<br><br>
Я люблю тебя.
</div>

<button id="loveBtn" onclick="loveBack(event)">
Я тоже ❤️
</button>

</div>

<!-- TAB 2 -->
<div id="t2" class="tab-content">

<h3>Наши фото 📸</h3>
<div class="proposal-block">
    <p style="margin:8px 0 8px; font-size:1rem; opacity:0.95; font-style:italic;">предложение</p>
    <img src="photo6.jpg" onclick="openImg(this.src)">
</div>

<div class="gallery">
<div class="gallery-caption">время с любмой</div>
<img src="photo1.jpg" onclick="openImg(this.src)">
<img src="photo2.jpg" onclick="openImg(this.src)">
<img src="photo3.jpg" onclick="openImg(this.src)">
<img src="photo4.jpg" onclick="openImg(this.src)">
<img src="photo5.jpg" onclick="openImg(this.src)">
</div>

</div>

<!-- TAB 3 -->
<div id="t3" class="tab-content">

<h3>💍 Свадьба</h3>
<p style="margin-top:6px; opacity:0.95;">Наши особые даты</p>
<div class="wedding-card">
    <div class="wedding-date">12.09.2026<span>роспись</span></div>
    <div class="wedding-date">13.09.2026<span>венчания</span></div>
</div>

</div>

<!-- TAB 4 -->
<div id="t4" class="tab-content">

<h3>📍 Где мы встретились ❤️</h3>

<br>

<div>
Именно здесь началась наша история,
которая изменила мою жизнь ❤️
</div>

<br>

<div id="map" class="map"></div>

</div>

</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
<script>
    let meetingMap;
    meetingMap = L.map('map').setView([50.47469161452671, 30.438860281686], 16);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
    }).addTo(meetingMap);

    const heartIcon = L.divIcon({
        className: 'heart-icon',
        html: '❤️',
        iconSize: [32, 32],
        iconAnchor: [16, 32]
    });

    L.marker([50.47469161452671, 30.438860281686], { icon: heartIcon }).addTo(meetingMap);
</script>

<!-- modal -->
<div class="modal" id="modal" onclick="closeImg()">
<img id="modalImg">
</div>

<script>

const music=document.getElementById("music");
let on=false;

/* music toggle */
document.addEventListener("click",(e)=>{
if(e.target.tagName==="BUTTON"||e.target.tagName==="IMG") return;

if(!on){
music.play().catch(()=>{});
on=true;
}else{
music.pause();
on=false;
}
});

/* tabs */
function showTab(id){
    document.querySelectorAll(".tab-content")
        .forEach(t=>t.classList.remove("active"));
    document.getElementById(id).classList.add("active");
    if(id === 't4' && meetingMap){
        setTimeout(()=> meetingMap.invalidateSize(), 0);
    }
}

/* timer */
setInterval(()=>{
const s=new Date("2026-05-01");
const n=new Date();
const d=Math.floor((n-s)/86400000);
const h=Math.floor((n-s)/3600000)%24;
const m=Math.floor((n-s)/60000)%60;
const sec=Math.floor((n-s)/1000)%60;
document.getElementById("time").innerText=
`${d}д ${h}ч ${m}м ${sec}с`;
},1000);

/* love */
function openLove(e){
e.stopPropagation();
document.getElementById("msg").classList.add("show");
document.getElementById("loveBtn").style.display="inline-block";
}

function loveBack(e){
e.stopPropagation();
explode();
alert("❤️ Я тоже люблю тебя ❤️");
}

/* photos */
function openImg(src){
document.getElementById("modal").style.display="flex";
document.getElementById("modalImg").src=src;
}
function closeImg(){
document.getElementById("modal").style.display="none";
}

/* hearts */
setInterval(()=>{
const h=document.createElement("div");
h.innerHTML="❤️";
h.className="heart";
h.style.left=Math.random()*100+"vw";
h.style.animationDuration="6s";
document.body.appendChild(h);
setTimeout(()=>h.remove(),6000);
},300);

/* roses */
setInterval(()=>{
const r=document.createElement("div");
r.innerHTML="🌹";
r.className="rose";
r.style.left=Math.random()*100+"vw";
r.style.animationDuration="7s";
document.body.appendChild(r);
setTimeout(()=>r.remove(),7000);
},500);

/* fireworks */
const c=document.getElementById("fireworks");
const ctx=c.getContext("2d");
c.width=innerWidth;
c.height=innerHeight;

window.addEventListener("resize",()=>{
c.width=innerWidth;
c.height=innerHeight;
});

let p=[];

class Part{
constructor(x,y){
this.x=x;
this.y=y;
this.vx=(Math.random()-0.5)*10;
this.vy=(Math.random()-0.5)*10;
this.life=100;
}
draw(){
ctx.font="20px Arial";
ctx.fillText("❤️",this.x,this.y);
}
update(){
this.x+=this.vx;
this.y+=this.vy;
this.life--;
this.draw();
}
}

function explode(){
for(let i=0;i<120;i++){
p.push(new Part(innerWidth/2,innerHeight/2));
}
}

function loop(){
ctx.clearRect(0,0,innerWidth,innerHeight);
p.forEach((x,i)=>{
x.update();
if(x.life<=0)p.splice(i,1);
});
requestAnimationFrame(loop);
}
loop();

</script>

</body>
</html>
