<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Для Сони 💖</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #ff9a9e, #fad0c4);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      text-align: center;
      color: #333;
      overflow: hidden;
    }

    .container {
      background: white;
      padding: 40px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
      position: relative;
      z-index: 1;
    }

    button {
      padding: 12px 25px;
      margin: 10px;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      cursor: pointer;
      transition: 0.3s;
    }

    .yes { background-color: #ff6b81; color: white; }
    .no { background-color: #1e90ff; color: white; }

    button:hover { transform: scale(1.1); }

    .popup {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0);
      background: white;
      padding: 30px 40px;
      border-radius: 20px;
      box-shadow: 0 15px 40px rgba(0,0,0,0.3);
      font-size: 22px;
      font-weight: bold;
      z-index: 10;
      transition: 0.3s ease;
    }

    .popup.show { transform: translate(-50%, -50%) scale(1); }

    #popupYes { color: #ff4d6d; }
    #popupNo { color: #333; }

    #overlay {
      position: fixed;
      width: 100%;
      height: 100%;
      top: 0;
      left: 0;
      background: rgba(0,0,0,0.4);
      opacity: 0;
      pointer-events: none;
      transition: 0.3s;
      z-index: 5;
    }

    #overlay.show {
      opacity: 1;
      pointer-events: all;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Соня, ты самая классная 💖</h1>
    <p>Даже если день плохой — ты всё равно топ ✨</p>

    <h2>Ты София? 🤔</h2>

    <button class="yes" onclick="answerYes()">Да</button>
    <button class="no" onclick="answerNo()">Нет</button>
  </div>

  <div id="overlay" onclick="closePopup()"></div>

  <div id="popupYes" class="popup">Нееет 😄 Ты Соня 💖💖💖</div>
  <div id="popupNo" class="popup">Хто я? 🤨</div>

  <script>
    function answerYes() {
      document.getElementById("popupYes").classList.add("show");
      document.getElementById("overlay").classList.add("show");
    }

    function answerNo() {
      document.getElementById("popupNo").classList.add("show");
      document.getElementById("overlay").classList.add("show");
    }

    function closePopup() {
      document.getElementById("popupYes").classList.remove("show");
      document.getElementById("popupNo").classList.remove("show");
      document.getElementById("overlay").classList.remove("show");
    }
  </script>
</body>
</html>
