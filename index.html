<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Для Ксюши ❤️</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{
    overflow:hidden;
    height:100vh;
    background:linear-gradient(-45deg,#ff758c,#ff7eb3,#ff9a9e,#fad0c4);
    background-size:400% 400%;
    animation:bg 12s ease infinite;
    color:white;
}

@keyframes bg{
    0%{background-position:0% 50%;}
    50%{background-position:100% 50%;}
    100%{background-position:0% 50%;}
}

.container{
    width:90%;
    max-width:1100px;
    margin:30px auto;
    text-align:center;
    position:relative;
    z-index:10;
}

h1{
    margin-bottom:20px;
    font-size:3rem;
}

.tabs{
    display:flex;
    justify-content:center;
    gap:10px;
    margin-bottom:25px;
    flex-wrap:wrap;
}

.tab-btn{
    padding:12px 25px;
    border:none;
    border-radius:50px;
    cursor:pointer;
    background:white;
    color:#ff4f81;
    font-weight:bold;
}

.tab-content{
    display:none;
    background:rgba(255,255,255,0.15);
    backdrop-filter:blur(10px);
    border-radius:20px;
    padding:25px;
}

.active{
    display:block;
}

.timer{
    font-size:1.4rem;
    line-height:2;
}

.gallery{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:20px;
}

.gallery img{
    width:100%;
    height:250px;
    object-fit:cover;
    border-radius:20px;
    box-shadow:0 0 15px rgba(0,0,0,.3);
}

.wedding{
    font-size:2rem;
    line-height:2;
}

#openLove{
    margin-top:25px;
    padding:15px 30px;
    border:none;
    border-radius:50px;
    background:white;
    color:#ff4f81;
    cursor:pointer;
    font-size:1.1rem;
}

.message{
    opacity:0;
    transition:1s;
    margin-top:25px;
    font-size:1.3rem;
    line-height:1.8;
}

.show{
    opacity:1;
}

#loveBtn{
    display:none;
    margin-top:25px;
    padding:15px 30px;
    border:none;
    border-radius:50px;
    background:#ff1744;
    color:white;
    cursor:pointer;
    font-size:1.1rem;
}

.heart,
.rose{
    position:absolute;
    pointer-events:none;
}

.heart{
    animation:heartFloat linear forwards;
}

.rose{
    animation:roseFall linear forwards;
}

@keyframes heartFloat{
    from{transform:translateY(100vh);}
    to{transform:translateY(-120px);opacity:0;}
}

@keyframes roseFall{
    from{transform:translateY(-100px) rotate(0deg);}
    to{transform:translateY(110vh) rotate(720deg);opacity:0;}
}

#fireworks{
    position:fixed;
    inset:0;
    pointer-events:none;
}

</style>
</head>

<body>

<audio id="music" loop>
    <source src="music.mp3" type="audio/mpeg">
</audio>

<canvas id="fireworks"></canvas>

<div class="container">

<h1>Для Ксюши ❤️</h1>

<div class="tabs">

<button class="tab-btn" onclick="showTab('timer')">❤️ Вместе</button>
<button class="tab-btn" onclick="showTab('photos')">📸 Фото</button>
<button class="tab-btn" onclick="showTab('wedding')">💍 Свадьба</button>

</div>

<!-- TAB 1 -->
<div id="timer" class="tab-content active">

<div class="timer">
Я люблю тебя уже:
<div id="loveTime"></div>
</div>

<button id="openLove" onclick="startLove(event)">
Открыть признание ❤️
</button>

<div class="message" id="message">
Ксюша...<br><br>
Ты стала самым важным человеком в моей жизни.<br><br>
Я люблю тебя ❤️
</div>

<button id="loveBtn" onclick="loveAnswer(event)">
Я тоже тебя люблю ❤️
</button>

</div>

<!-- TAB 2 -->
<div id="photos" class="tab-content">

<h2>Наши фото ❤️</h2><br>

<div class="gallery">
<img src="photo1.jpg">
<img src="photo2.jpg">
<img src="photo3.jpg">
<img src="photo4.jpg">
</div>

</div>

<!-- TAB 3 -->
<div id="wedding" class="tab-content">

<div class="wedding">
💍 Дата свадьбы<br><br>
...
</div>

</div>

</div>

<script>

const music = document.getElementById("music");
let musicPlaying = false;

// 🔊 ТУТ ГЛАВНОЕ: любое нажатие включает/выключает музыку
document.addEventListener("click", function(e){

    // не реагируем на кнопки управления
    if(e.target.tagName === "BUTTON") return;

    if(!musicPlaying){
        music.play().catch(()=>{});
        musicPlaying = true;
    } else {
        music.pause();
        musicPlaying = false;
    }

});

function showTab(id){

document.querySelectorAll(".tab-content")
.forEach(t=>t.classList.remove("active"));

document.getElementById(id)
.classList.add("active");

}

function updateTimer(){

const start = new Date("2026-05-01T00:00:00");
const now = new Date();

const diff = now - start;

const d = Math.floor(diff/86400000);
const h = Math.floor(diff/3600000)%24;
const m = Math.floor(diff/60000)%60;
const s = Math.floor(diff/1000)%60;

document.getElementById("loveTime").innerText =
`${d} дней ${h} часов ${m} минут ${s} секунд`;

}

setInterval(updateTimer,1000);
updateTimer();

function startLove(e){

e.stopPropagation();

document.getElementById("message").classList.add("show");
document.getElementById("loveBtn").style.display="inline-block";

}

function loveAnswer(e){

e.stopPropagation();

explode();

alert("❤️ Я тоже тебя люблю ❤️");

}

// ❤️ сердечки
function heart(){

const h=document.createElement("div");
h.className="heart";
h.innerHTML="❤️";
h.style.left=Math.random()*100+"vw";
h.style.fontSize=(Math.random()*20+15)+"px";
h.style.animationDuration=(Math.random()*5+5)+"s";

document.body.appendChild(h);

setTimeout(()=>h.remove(),10000);

}
setInterval(heart,300);

// 🌹 розы
function rose(){

const r=document.createElement("div");
r.className="rose";
r.innerHTML="🌹";
r.style.left=Math.random()*100+"vw";
r.style.fontSize=(Math.random()*20+20)+"px";
r.style.animationDuration=(Math.random()*6+5)+"s";

document.body.appendChild(r);

setTimeout(()=>r.remove(),12000);

}
setInterval(rose,500);

// 🎆 фейерверк
const canvas=document.getElementById("fireworks");
const ctx=canvas.getContext("2d");

canvas.width=window.innerWidth;
canvas.height=window.innerHeight;

window.addEventListener("resize",()=>{
canvas.width=window.innerWidth;
canvas.height=window.innerHeight;
});

let particles=[];

class Particle{
constructor(x,y){
this.x=x;
this.y=y;
this.vx=(Math.random()-0.5)*10;
this.vy=(Math.random()-0.5)*10;
this.life=120;
}
draw(){
ctx.font="24px Arial";
ctx.fillText("❤️",this.x,this.y);
}
update(){
this.x+=this.vx;
this.y+=this.vy;
this.life--;
this.draw();
}
}

function explode(){
for(let i=0;i<120;i++){
particles.push(new Particle(canvas.width/2,canvas.height/2));
}
}

function loop(){
ctx.clearRect(0,0,canvas.width,canvas.height);
particles.forEach((p,i)=>{
p.update();
if(p.life<=0) particles.splice(i,1);
});
requestAnimationFrame(loop);
}
loop();

</script>

</body>
</html>
