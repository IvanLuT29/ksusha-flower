<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Для Ксюши ❤️</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{
    overflow-x:hidden;
    min-height:100vh;
    background:linear-gradient(-45deg,#ff758c,#ff7eb3,#ff9a9e,#fad0c4);
    background-size:400% 400%;
    animation:bg 12s ease infinite;
    color:white;
}

/* 🌈 background */
@keyframes bg{
    0%{background-position:0% 50%;}
    50%{background-position:100% 50%;}
    100%{background-position:0% 50%;}
}

.container{
    width:92%;
    max-width:1000px;
    margin:20px auto;
    text-align:center;
    position:relative;
    z-index:10;
}

h1{
    font-size:clamp(1.8rem,5vw,3rem);
    margin-bottom:15px;
}

/* 📱 tabs */
.tabs{
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:10px;
    margin-bottom:20px;
}

.tab-btn{
    padding:12px 18px;
    border:none;
    border-radius:40px;
    background:white;
    color:#ff4f81;
    font-weight:bold;
    font-size:14px;
}

/* 📦 tab content */
.tab-content{
    display:none;
    background:rgba(255,255,255,0.15);
    backdrop-filter:blur(10px);
    border-radius:18px;
    padding:18px;
}

.active{display:block;}

/* ⏳ timer */
.timer{
    font-size:clamp(1rem,4vw,1.4rem);
    line-height:1.8;
}

/* 📸 gallery FIX */
.gallery{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(140px,1fr));
    gap:10px;
}

.gallery img{
    width:100%;
    height:140px;
    object-fit:cover;
    border-radius:12px;
    cursor:pointer;
    transition:0.2s;
}

.gallery img:active{
    transform:scale(0.97);
}

/* 💍 wedding */
.wedding{
    font-size:clamp(1.2rem,4vw,2rem);
    line-height:1.8;
}

/* ❤️ buttons */
button{
    padding:12px 20px;
    border:none;
    border-radius:40px;
    cursor:pointer;
    font-size:14px;
}

#openLove{
    background:white;
    color:#ff4f81;
    margin-top:15px;
}

#loveBtn{
    display:none;
    margin-top:15px;
    background:#ff1744;
    color:white;
}

/* 💌 message */
.message{
    opacity:0;
    transform:translateY(10px);
    transition:1s;
    margin-top:15px;
    font-size:clamp(1rem,3.5vw,1.3rem);
    line-height:1.6;
}

.show{
    opacity:1;
    transform:translateY(0);
}

/* ❤️ hearts + 🌹 roses */
.heart,.rose{
    position:absolute;
    pointer-events:none;
}

#fireworks{
    position:fixed;
    inset:0;
    pointer-events:none;
}

/* 🖼 FULLSCREEN PHOTO VIEW */
.modal{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.85);
    display:none;
    justify-content:center;
    align-items:center;
    z-index:999;
}

.modal img{
    max-width:95%;
    max-height:85%;
    border-radius:15px;
}

</style>
</head>

<body>

<audio id="music" loop>
    <source src="music.mp3">
</audio>

<canvas id="fireworks"></canvas>

<div class="container">

<h1>Для Ксюши ❤️</h1>

<!-- tabs -->
<div class="tabs">
<button class="tab-btn" onclick="showTab('timer')">❤️ Вместе</button>
<button class="tab-btn" onclick="showTab('photos')">📸 Фото</button>
<button class="tab-btn" onclick="showTab('wedding')">💍 Свадьба</button>
</div>

<!-- TIMER -->
<div id="timer" class="tab-content active">

<div class="timer">
Я люблю тебя уже:<br><br>
<div id="loveTime"></div>
</div>

<button id="openLove" onclick="startLove(event)">
Открыть ❤️
</button>

<div class="message" id="message">
Ксюша...<br><br>
Ты — самое важное в моей жизни ❤️<br><br>
Я люблю тебя.
</div>

<button id="loveBtn" onclick="loveAnswer(event)">
Я тоже ❤️
</button>

</div>

<!-- PHOTOS -->
<div id="photos" class="tab-content">

<h2>Наши фото 📸</h2><br>

<div class="gallery">

<img src="photo1.jpg" onclick="openPhoto(this.src)">
<img src="photo2.jpg" onclick="openPhoto(this.src)">
<img src="photo3.jpg" onclick="openPhoto(this.src)">
<img src="photo4.jpg" onclick="openPhoto(this.src)">

</div>

</div>

<!-- WEDDING -->
<div id="wedding" class="tab-content">

<div class="wedding">
💍 Свадьба<br><br>
...
</div>

</div>

</div>

<!-- PHOTO MODAL -->
<div class="modal" id="modal" onclick="closePhoto()">
<img id="modalImg">
</div>

<script>

const music=document.getElementById("music");
let musicOn=false;

/* 🔊 tap anywhere toggle music */
document.addEventListener("click",(e)=>{

if(e.target.tagName==="BUTTON" || e.target.tagName==="IMG") return;

if(!musicOn){
music.play().catch(()=>{});
musicOn=true;
}else{
music.pause();
musicOn=false;
}

});

/* tabs */
function showTab(id){
document.querySelectorAll(".tab-content")
.forEach(t=>t.classList.remove("active"));
document.getElementById(id).classList.add("active");
}

/* timer */
function updateTimer(){
const start=new Date("2026-05-01");
const now=new Date();
const d=Math.floor((now-start)/86400000);
const h=Math.floor((now-start)/3600000)%24;
const m=Math.floor((now-start)/60000)%60;
const s=Math.floor((now-start)/1000)%60;

document.getElementById("loveTime").innerText=
`${d} дней ${h}ч ${m}м ${s}с`;
}
setInterval(updateTimer,1000);
updateTimer();

/* love text */
function startLove(e){
e.stopPropagation();
document.getElementById("message").classList.add("show");
document.getElementById("loveBtn").style.display="inline-block";
}

function loveAnswer(e){
e.stopPropagation();
explode();
alert("❤️ Я тоже тебя люблю ❤️");
}

/* PHOTO ZOOM FIX */
function openPhoto(src){
document.getElementById("modal").style.display="flex";
document.getElementById("modalImg").src=src;
}

function closePhoto(){
document.getElementById("modal").style.display="none";
}

/* hearts */
setInterval(()=>{
const h=document.createElement("div");
h.innerHTML="❤️";
h.className="heart";
h.style.left=Math.random()*100+"vw";
h.style.fontSize="18px";
h.style.animationDuration="6s";
document.body.appendChild(h);
setTimeout(()=>h.remove(),6000);
},300);

/* roses */
setInterval(()=>{
const r=document.createElement("div");
r.innerHTML="🌹";
r.className="rose";
r.style.left=Math.random()*100+"vw";
r.style.fontSize="22px";
r.style.animationDuration="7s";
document.body.appendChild(r);
setTimeout(()=>r.remove(),7000);
},500);

/* fireworks */
const canvas=document.getElementById("fireworks");
const ctx=canvas.getContext("2d");

function resize(){
canvas.width=innerWidth;
canvas.height=innerHeight;
}
resize();
window.addEventListener("resize",resize);

let particles=[];

class P{
constructor(x,y){
this.x=x;this.y=y;
this.vx=(Math.random()-0.5)*10;
this.vy=(Math.random()-0.5)*10;
this.life=100;
}
draw(){
ctx.font="20px Arial";
ctx.fillText("❤️",this.x,this.y);
}
update(){
this.x+=this.vx;
this.y+=this.vy;
this.life--;
this.draw();
}
}

function explode(){
for(let i=0;i<100;i++){
particles.push(new P(innerWidth/2,innerHeight/2));
}
}

function loop(){
ctx.clearRect(0,0,innerWidth,innerHeight);
particles.forEach((p,i)=>{
p.update();
if(p.life<=0) particles.splice(i,1);
});
requestAnimationFrame(loop);
}
loop();

</script>

</body>
</html>
