<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Для Сони 💖</title>
  <style>
    :root {
      --bg1: #ff9a9e;
      --bg2: #fad0c4;
      --accent: #ff6b81;
      --accent2: #1e90ff;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial;
      background: linear-gradient(135deg, var(--bg1), var(--bg2));
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
      text-align: center;
      overflow: hidden;
    }

    .container {
      width: 100%;
      max-width: 420px;
      background: white;
      padding: 24px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
      position: relative;
      z-index: 1;
    }

    h1 { font-size: 22px; margin-bottom: 8px; }
    p { font-size: 16px; margin-bottom: 20px; }
    h2 { font-size: 18px; margin-bottom: 15px; }

    .buttons {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      cursor: pointer;
      transition: 0.2s;
    }

    .yes { background: var(--accent); color: white; }
    .no { background: var(--accent2); color: white; position: relative; }

    button:active { transform: scale(0.95); }

    /* POPUP */
    .popup {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0);
      width: 90%;
      max-width: 320px;
      background: white;
      padding: 24px;
      border-radius: 18px;
      box-shadow: 0 15px 40px rgba(0,0,0,0.3);
      font-size: 18px;
      font-weight: bold;
      z-index: 10;
      transition: 0.25s;
    }

    .popup.show { transform: translate(-50%, -50%) scale(1); }

    #popupYes { color: #ff4d6d; }
    #popupNo { color: #333; }

    #overlay {
      position: fixed;
      width: 100%;
      height: 100%;
      top: 0;
      left: 0;
      background: rgba(0,0,0,0.4);
      opacity: 0;
      pointer-events: none;
      transition: 0.25s;
      z-index: 5;
    }

    #overlay.show {
      opacity: 1;
      pointer-events: all;
    }

    /* Сердечки */
    .heart {
      position: fixed;
      font-size: 20px;
      animation: floatUp 2s linear forwards;
    }

    @keyframes floatUp {
      0% { transform: translateY(0) scale(1); opacity: 1; }
      100% { transform: translateY(-200px) scale(1.5); opacity: 0; }
    }

  </style>
</head>
<body>
  <div class="container">
    <h1>Соня, ты самая классная 💖</h1>
    <p>Даже если день плохой — ты всё равно топ ✨</p>

    <h2>Ты София? 🤔</h2>

    <div class="buttons">
      <button class="yes" onclick="answerYes()">Да</button>
      <button class="no" id="noBtn" onclick="answerNo()">Нет</button>
    </div>
  </div>

  <div id="overlay" onclick="closePopup()"></div>

  <div id="popupYes" class="popup">Нееет 😄 Ты Соня 💖💖💖</div>
  <div id="popupNo" class="popup">Хто я? 🤨</div>

  <script>
    function answerYes() {
      showPopup('popupYes');
      createHearts();
    }

    function answerNo() {
      showPopup('popupNo');
    }

    function showPopup(id) {
      document.getElementById(id).classList.add('show');
      document.getElementById('overlay').classList.add('show');
    }

    function closePopup() {
      document.getElementById('popupYes').classList.remove('show');
      document.getElementById('popupNo').classList.remove('show');
      document.getElementById('overlay').classList.remove('show');
    }

    // Убегающая кнопка 😄
    const noBtn = document.getElementById('noBtn');
    noBtn.addEventListener('mouseover', () => {
      const x = Math.random() * (window.innerWidth - 100);
      const y = Math.random() * (window.innerHeight - 50);
      noBtn.style.position = 'fixed';
      noBtn.style.left = x + 'px';
      noBtn.style.top = y + 'px';
    });

    // Сердечки 💖
    function createHearts() {
      for (let i = 0; i < 10; i++) {
        const heart = document.createElement('div');
        heart.className = 'heart';
        heart.innerText = '💖';
        heart.style.left = Math.random() * window.innerWidth + 'px';
        heart.style.top = window.innerHeight + 'px';
        document.body.appendChild(heart);

        setTimeout(() => heart.remove(), 2000);
      }
    }
  </script>
</body>
</html>
